<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    background: radial-gradient(circle at 85% 0%, #14295c 0%, #060b1a 45%, #020409 100%);
    display: flex;
    justify-content: center;
    padding: 48px 20px 60px;
  }

  .page {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .header-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
  }

  .avatar {
    width: 110px;
    height: auto;
    flex-shrink: 0;
  }

  .name-block {
    text-align: center;
    margin-top: -10px;
  }

  .name-block h1 {
    font-size: 1.7rem;
    margin-bottom: 4px;
    white-space: nowrap;
  }

  .name-block .subtitle {
    margin-bottom: 0;
    font-size: 0.75rem;
  }

  h1 {
    color: #ffffff;
    font-size: 2.1rem;
    line-height: 1.2;
    margin-bottom: 6px;
  }

  .subtitle {
    color: #7de3b5;
    font-weight: 600;
    letter-spacing: 0.03em;
    font-size: 0.95rem;
    text-transform: uppercase;
    margin-bottom: 18px;
  }

  .tagline {
    color: #c7cbe0;
    font-size: 1rem;
    line-height: 1.5;
    margin-bottom: 32px;
    padding: 0 8px;
  }

  .thumbs {
    display: flex;
    gap: 18px;
    margin-bottom: 36px;
  }

  .thumbs a {
    width: 96px;
    height: 96px;
    border-radius: 12px;
    overflow: hidden;
    display: block;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
    border: 2px solid rgba(255, 255, 255, 0.08);
    flex-shrink: 0;
  }

  .thumbs img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 32px;
  }

  .links a {
    width: 100%;
    background: #ffffff;
    color: #12235c;
    font-weight: 700;
    font-size: 1rem;
    text-decoration: none;
    padding: 16px 20px;
    border-radius: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    transition: transform 0.15s ease;
  }

  .links a:hover {
    transform: translateY(-2px);
  }

  .socials {
    display: flex;
    gap: 16px;
    margin-bottom: 24px;
  }

  .socials a {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
  }

  .socials svg {
    width: 20px;
    height: 20px;
  }

  footer {
    color: #565b78;
    font-size: 0.8rem;
  }
</style>
